name: Build and Compile Sketch

on:
  push:
    paths:
      - 'xiao-arduino/**'
  pull_request:
    paths:
      - 'xiao-arduino/**'
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        board: [BOARD_EE02, BOARD_EE04]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Arduino Directories
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/.cache/arduino
            /tmp/arduino
          key: ${{ runner.os }}-arduino-${{ hashFiles('**/*.ino', '**/*.properties') }}
          restore-keys: |
            ${{ runner.os }}-arduino-
        
      - name: Compile Sketch for EE02
        uses: arduino/compile-sketches@v1
        with:
          #platforms: |
          #  - name: esp32:esp32
          #    source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          fqbn: esp32:esp32:XIAO_ESP32S3_Plus:PSRAM=opi
          sketch-paths: ./xiao-arduino
          cli-compile-flags: |
            - --build-cache-path=/tmp/arduino/build-cache
            - "--build-property"
            - "compiler.cpp.extra_flags=-DBOARD=${{ matrix.board }}"
            - --output-dir=${{ github.workspace }}/xiao-arduino/build_output/${{ matrix.board }}
          libraries: |
            - source-url: https://github.com/Seeed-Studio/Seeed_GFX.git
            - source-url: https://github.com/bakercp/CRC32.git
            - name: WiFiManager
      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.board }}
          path: xiao-arduino/build_output/${{ matrix.board }}/
          if-no-files-found: error
  commit:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download all board outputs
        uses: actions/download-artifact@v4
        with:
          pattern: BOARD_*
          path: xiao-arduino/build_output/
          merge-multiple: false

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure the Git author using the standard GitHub Actions bot identity
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add xiao-arduino/build_output/
          
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: automated build update [skip ci]"
            
            # 4. Push changes back to the branch that triggered the workflow
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes detected in the workspace. Skipping commit."
          fi
  
